    <script>
    function fetchFaculties() {
        const uniId = document.getElementById('universitySelect').value;
        const facultySelect = document.getElementById('facultySelect');
        
        // Resetujemy selecta i pokazujemy "Loading..."
        facultySelect.innerHTML = '<option value="" disabled selected>Loading faculties...</option>';

        fetch('/get-faculties', {
            method: "POST",
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ id: uniId })
        })
        .then(response => response.json())
        .then(data => {
            // Czyścimy i dodajemy domyślną opcję
            facultySelect.innerHTML = '<option value="" disabled selected>Choose your faculty</option>';
            
            if (data.length === 0) {
                facultySelect.innerHTML += '<option value="" disabled>No faculties found</option>';
            } else {
                // Generujemy opcje z pobranych danych
                data.forEach(faculty => {
                    // ZABEZPIECZENIE 3: Sanityzacja nazwy wydziału po stronie JS
                    const safeName = faculty.name.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
                    facultySelect.innerHTML += `<option value="${faculty.id}">${safeName}</option>`;
                });
            }
        })
        .catch(error => {
            console.error('Error:', error);
            facultySelect.innerHTML = '<option value="" disabled selected>Error loading faculties</option>';
        });
    }
    </script>
