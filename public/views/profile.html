    <script>
        function toggleNotifications() {
            const isChecked = document.getElementById('notifySwitch').checked;
            
            // Wysyłamy do backendu
            fetch('/toggle-notifications', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled: isChecked })
            })
            .then(res => {
                if(res.ok) console.log('Notification preference saved:', isChecked);
                else console.error('Failed to save preference');
            })
            .catch(err => console.error('Error:', err));
        }
    </script>
